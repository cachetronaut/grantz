[project]
name = "grantz"
version = "0.0.0"
description = "Scoped, signed, monotonically attenuable delegation tokens."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "cryptography>=42",
  "dockbay>=0.0.0",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
]

[project.urls]
Homepage = "https://github.com/cachetronaut/grantz"
Repository = "https://github.com/cachetronaut/grantz"
Issues = "https://github.com/cachetronaut/grantz/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grantz"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "ty>=0.0.1a8"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ty.environment]
extra-paths = ["src"]
